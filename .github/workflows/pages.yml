name: Publish offline games

# Tests every game, then publishes them all as ONE GitHub Pages site:
#   /                 the collection page, with a Play link to each game
#   /VAGRANT_STARS/   3D space trading and combat
#   /IRONWAKE/        capital-ship broadside combat
# scripts/site.mjs holds the list of games; add a folder there to publish another.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# After that it deploys on every push to main, or on demand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-games-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # browser download and three play-throughs take about three minutes on a good day
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test every game and the site
        run: |
          node --version
          node --test VAGRANT_STARS/tests/*.test.js IRONWAKE/tests/*.test.js tests/*.test.js
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Play both games and verify presentation
        run: |
          node VAGRANT_STARS/tests/browser-smoke.mjs
          node VAGRANT_STARS/tests/controller-browser.mjs
          node IRONWAKE/tests/browser-smoke.mjs
          node tests/presentation-browser.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: presentation-${{ github.sha }}
          path: evidence/browser/
          if-no-files-found: ignore
      - name: Stage the site and check each game is in it
        run: |
          node scripts/site.mjs build _site "${GITHUB_SHA::12}"
          for page in index.html VAGRANT_STARS/index.html IRONWAKE/index.html sw.js; do test -s "_site/$page" || { echo "missing $page"; exit 1; }; done
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stage the site
        run: node scripts/site.mjs build _site "${GITHUB_SHA::12}"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
